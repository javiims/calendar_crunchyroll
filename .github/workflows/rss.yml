name: Crunchyroll Calendar Tracker

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: pip install -r requirements.txt

    - name: Ejecutar Scraper
      run: python scraper.py

    - name: Subir respuesta de depuración si falla
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: debug
        path: debug_response.txt
        if-no-files-found: ignore

    - name: Guardar cambios (RSS y base de datos)
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        touch history.json feed.xml
        git add feed.xml history.json
        git commit -m "Actualización del calendario de estrenos" || exit 0
        git push
